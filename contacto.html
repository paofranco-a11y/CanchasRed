<body>
    <main class="contenedor-contacto">
        <h1>Contacto</h1>
        <p>¿Tienes alguna pregunta? ¡Estamos aquí para ayudarte!</p>
        <form id="formularioContacto" novalidate>
            <div class="campo-formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <span class="mensaje-error" id="errorNombre"></span>
            </div>
            <div class="campo-formulario">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@dgmail.com" required>
                <span class="mensaje-error" id="errorEmail"></span>
            </div>
            <div class="campo-formulario">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                <span class="mensaje-error" id="errorMensaje"></span>
            </div>
            <button type="submit">Enviar</button>
        </form>
    </main>

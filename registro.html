<main class="contenedor-autenticacion">
    <div class="tarjeta-registro">
        <h1 class="titulo-registro">Crea tu cuenta</h1>
        <p class="subtitulo-registro">Regístrate para empezar</p>

        <div class="selector-roles">
            <label class="opcion-rol">
                <input type="radio" name="rol" value="dueno" checked>
                <div class="tarjeta-rol-info">
                    <span class="badge-rol">DC</span>
                    <strong>Dueño de Cancha</strong>
                    <small>Publica y gestiona recintos</small>
                </div>
            </label>
            <label class="opcion-rol">
                <input type="radio" name="rol" value="deportista">
                <div class="tarjeta-rol-info">
                    <span class="badge-rol">DP</span>
                    <strong>Deportista</strong>
                    <small>Reserva canchas deportivas</small>
                </div>
            </label>
        </div>

        <form id="formularioRegistro" class="form-validar" novalidate>
            <div class="campo-formulario">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="tucorreo@gmail.com" maxlength="100" data-required="true" data-type="email">
                <span class="mensaje-error" id="errorCorreo"></span>
            </div>

            <div class="campo-formulario">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" data-required="true">
                <span class="mensaje-error" id="errorPassword"></span>
            </div>

            <div class="campo-formulario">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" data-required="true">
                <span class="mensaje-error" id="errorConfirmPassword"></span>
            </div>

            <button type="submit" class="boton-primario-form">Crear cuenta</button>
        </form>

        <p class="enlace-alternativo">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
</main>

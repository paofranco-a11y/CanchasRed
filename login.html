<main class="contenedor-autenticacion">
    <div class="tarjeta-registro">
        <h1 class="titulo-registro">Inicia sesión</h1>
        <p class="subtitulo-registro">Ingresa tus datos para continuar</p>

        <form id="formularioLogin" class="form-validar" novalidate>
            <div class="campo-formulario">
                <label for="correoLogin">Correo electrónico</label>
                <input type="email" id="correoLogin" name="correoLogin" placeholder="tucorreo@gmail.com" data-required="true" data-type="email">
                <span class="mensaje-error" id="errorCorreoLogin"></span>
            </div>

            <div class="campo-formulario">
                <label for="passwordLogin">Contraseña</label>
                <input type="password" id="passwordLogin" name="passwordLogin" placeholder="••••••••" data-required="true">
                <span class="mensaje-error" id="errorPasswordLogin"></span>
            </div>

            <button type="submit" class="boton-primario-form">Iniciar sesión</button>
        </form>

        <p class="enlace-alternativo">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </div>
</main>
